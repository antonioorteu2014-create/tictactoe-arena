name: Pages

# Publica la carpeta web en GitHub Pages. Antes de publicar juega el torneo y deja
# la clasificación junto a la página, así el marcador siempre está al día.

on:
  # Cada vez que cambia main (por ejemplo, al fusionar un bot nuevo)
  push:
    branches: [main]

  # Todos los días a las 05:00 UTC (las 6 o las 7 en España), sin que nadie haga nada
  schedule:
    - cron: "0 5 * * *"

  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

# Permisos minimos para publicar en pages
permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos despliegues seguidos, se ponen en cola, no cortamos
# uno a medias por que puede dejar la pagina publicada a medio actualizar
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Mete el juego, los bots y el puente en web/py.zip, que la página descarga
      # y ejecuta en el navegador con Pyodide. py.zip no se guarda en git: se
      # genera aquí en cada publicación, así nunca queda desactualizado.
      - name: Generar web/py.zip
        run: python scripts/build_web.py

      # Juega el torneo con todos los bots admitidos y deja la clasificación en
      # web/leaderboard.json, que es el archivo que lee el marcador de la página.
      - name: Jugar el torneo
        run: |
          python -m pip install -e .
          tictactoe-tournament --time-limit 2 --output web/leaderboard.json

      - name: Empaquetar la carpeta web
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5