site_name: Tic-Tac-Toe Arena
site_description: >-
  El tres en raya como proyecto open-source: librería de Python, API para bots y
  torneo automático.
site_url: https://tictactoe-arena.readthedocs.io/
repo_url: https://github.com/antonioorteu2014-create/tictactoe-arena
repo_name: tictactoe-arena
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - content.code.copy
    - navigation.footer
    - search.highlight

nav:
  - Inicio: index.md
  - Reglas del juego: rules.md
  - Subir un bot:
      - 1. El API de jugador: upload-a-bot/player-api.md
      - 2. Enviar tu bot: upload-a-bot/submit-a-player.md
  - Referencia del API: api.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  # Genera la «Referencia del API» (docs/api.md) a partir de los docstrings.
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            members_order: source
            heading_level: 2
