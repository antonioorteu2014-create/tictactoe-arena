# Configuración de Read the Docs: cómo construir el sitio de documentación.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

# Instala el paquete con los extras `docs` (MkDocs y el tema Material).
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
